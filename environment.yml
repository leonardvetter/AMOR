name: multilayer-RBNO_env
channels:
  - conda-forge
  - pytorch # PyTorch's channel for better package resolution
  - defaults
dependencies:
  - python=3.12
  - pytorch=2.7.1 
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - jupyterlab
